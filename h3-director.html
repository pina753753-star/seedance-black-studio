    function log(text,kind){var el=document.createElement('div');el.className='msg '+(kind||'system');el.textContent=text;$('log').appendChild(el);$('log').scrollTop=$('log').scrollHeight}
    function esc(text){return String(text==null?'':text).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

    async function token(){if(!supabaseClient)return'';var r=await supabaseClient.auth.getSession();authToken=(r&&r.data&&r.data.session&&r.data.session.access_token)||'';return authToken}
    async function api(path,options){var t=await token();if(!t)throw new Error('ログインが必要です。');var opts=options||{};var headers=Object.assign({'Authorization':'Bearer '+t},opts.headers||{});if(opts.body)headers['Content-Type']='application/json';var r=await fetch(path,Object.assign({},opts,{headers:headers}));var data={};try{data=await r.json()}catch(e){}if(!r.ok){var err=new Error(data.message||data.error||'通信に失敗しました。');err.code=data.error;err.data=data;throw err}return data}
    function uuid(){return crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}
    function directorPrompt(text){
      var prompt=String(text||'').trim();
      if(
        /ゆっくり|ゆるやか|スロー|slowly|slow[\s-]?motion|高速|倍速|fast[\s-]?motion|普通の速度|通常速度|実時間/i.test(prompt)

    function isPreviewHost(){

    function elapsedFromStart(ts){

    }
    function startVideoClockDiagnostics(myGeneration){
      var videoEl=$('video');
      if(!videoEl||typeof videoEl.requestVideoFrameCallback!=='function'){
        diagnostic('video clock unavailable');
        return;
      }
      function onFrame(now,metadata){
        if(myGeneration!==diagnosticsGeneration||!live)return;
        try{
          if(videoClockBaseWall===null){
            videoClockBaseWall=performance.now();
            videoClockBaseMedia=metadata.mediaTime!=null?metadata.mediaTime:null;
            videoClockBasePresentedFrames=metadata.presentedFrames!=null?metadata.presentedFrames:null;
            videoClockBaseExpectedDisplayTime=metadata.expectedDisplayTime!=null?metadata.expectedDisplayTime:null;
            videoClockBaseRtpTimestamp=metadata.rtpTimestamp!=null?metadata.rtpTimestamp:null;
            videoClockLastLogAt=videoClockBaseWall;
          }
          if(metadata.presentedFrames!=null)lastPresentedFrames=metadata.presentedFrames;
          var nowWall=performance.now();
          if(nowWall-videoClockLastLogAt>=5000){
            videoClockLastLogAt=nowWall;
            var wallElapsed=(nowWall-videoClockBaseWall)/1000;
            var mediaElapsed=(metadata.mediaTime!=null&&videoClockBaseMedia!=null)?(metadata.mediaTime-videoClockBaseMedia):null;
            lastVideoWallElapsed=wallElapsed;
            lastVideoMediaElapsed=mediaElapsed;
            lastVideoClockRatio=(mediaElapsed!=null&&wallElapsed>0)?(mediaElapsed/wallElapsed):null;
            var presentationFps=(metadata.presentedFrames!=null&&videoClockBasePresentedFrames!=null&&wallElapsed>0)
              ?((metadata.presentedFrames-videoClockBasePresentedFrames)/wallElapsed):null;

              'video clock: wall='+wallElapsed.toFixed(2)+'s'+
              ' / media='+(mediaElapsed!=null?mediaElapsed.toFixed(2):'なし')+'s'+
              ' / ratio='+(lastVideoClockRatio!=null?lastVideoClockRatio.toFixed(3):'なし')+
              ' / presentedFrames='+(metadata.presentedFrames!=null?metadata.presentedFrames:'なし')+
              ' / presentationFps='+(presentationFps!=null?presentationFps.toFixed(2):'なし')+
              ' / rtpTimestamp='+(metadata.rtpTimestamp!=null?metadata.rtpTimestamp:'なし')
            );
          }
        }catch(e){}
        if(myGeneration===diagnosticsGeneration&&live){
          try{videoEl.requestVideoFrameCallback(onFrame)}catch(e){}
        }
      }
      try{videoEl.requestVideoFrameCallback(onFrame)}catch(e){}
    }
    function startWebrtcStatsDiagnostics(myGeneration){
      if(!pc||typeof pc.getStats!=='function')return;

        if(myGeneration!==diagnosticsGeneration||!live||!pc)return;
        pc.getStats().then(function(stats){
          if(myGeneration!==diagnosticsGeneration||!live)return;
          var videoTrackId=(remoteStream&&remoteStream.getVideoTracks()[0])?remoteStream.getVideoTracks()[0].id:null;
          var inbound=null,byTrackId=null,byMaxFramesDecoded=null;

            if(!report||report.type!=='inbound-rtp'||report.kind!=='video')return;

            if(!byMaxFramesDecoded||(Number(report.framesDecoded||0)>Number(byMaxFramesDecoded.framesDecoded||0)))byMaxFramesDecoded=report;
          });
          inbound=byTrackId||byMaxFramesDecoded;
          if(!inbound)return;
          var codecId=inbound.codecId;
          var codecMime=null;
          if(codecId&&typeof stats.get==='function'){
            var codecReport=stats.get(codecId);
            if(codecReport&&codecReport.mimeType)codecMime=codecReport.mimeType;
          }
          var jitterBufferAvgMs=(inbound.jitterBufferDelay!=null&&inbound.jitterBufferEmittedCount)
            ?(inbound.jitterBufferDelay/inbound.jitterBufferEmittedCount*1000):null;
          var interFrameAvgMs=(inbound.totalInterFrameDelay!=null&&inbound.framesDecoded!=null)
            ?(inbound.totalInterFrameDelay/Math.max(inbound.framesDecoded-1,1)*1000):null;
          var parts=[];
          if(inbound.framesPerSecond!=null)parts.push('fps='+inbound.framesPerSecond);
          if(inbound.framesReceived!=null)parts.push('received='+inbound.framesReceived);
          if(inbound.framesDecoded!=null)parts.push('decoded='+inbound.framesDecoded);
          if(inbound.framesDropped!=null)parts.push('dropped='+inbound.framesDropped);
          if(inbound.packetsLost!=null)parts.push('packetsLost='+inbound.packetsLost);
          if(inbound.jitter!=null)parts.push('jitter='+inbound.jitter);
          if(jitterBufferAvgMs!=null)parts.push('jitterBufferAvg='+jitterBufferAvgMs.toFixed(1)+'ms');
          if(interFrameAvgMs!=null)parts.push('interFrameAvg='+interFrameAvgMs.toFixed(1)+'ms');
          if(codecMime)parts.push('codec='+codecMime);
          if(parts.length)diagnostic('webrtc video: '+parts.join(' / '));
        }).catch(function(){});

    function savePendingStart(value){try{sessionStorage.setItem(pendingStartKey,JSON.stringify(value))}catch(e){}}

      var lastTime=Number(videoEl.currentTime||0);

      while(Date.now()-startedAt<15000){
        await new Promise(function(resolve){setTimeout(resolve,250)});

        // WebRTC MediaStreamから履歴ファイル再生へ切り替える際、
        // iPhone/Safariを含めてvideo要素を一度完全にリセットする。
        try{videoEl.pause()}catch(e){}
        videoEl.srcObject=null;
        videoEl.removeAttribute('src');
        try{videoEl.load()}catch(e){}

        var playbackSettled=false;

        function cleanupPlaybackListeners(){
          videoEl.removeEventListener('canplay',onCanPlay);
          videoEl.removeEventListener('error',onPlaybackError);
        }

        function onPlaybackError(){
          if(playbackSettled)return;
          playbackSettled=true;
          cleanupPlaybackListeners();

          var code=videoEl.error&&videoEl.error.code
            ?videoEl.error.code
            :'unknown';

          diagnostic(
            'history playback error: code='+code+
            ' / contentType='+(d.contentType||'unknown')
          );

          notice('保存した動画を再生できませんでした。');
        }

        function onCanPlay(){
          if(playbackSettled)return;
          playbackSettled=true;
          cleanupPlaybackListeners();

          diagnostic(
            'history playback ready: contentType='+
            (d.contentType||'unknown')
          );

          var playPromise;
          try{
            playPromise=videoEl.play();
          }catch(e){
            notice('再生ボタンを押してください。');
            return;
          }

          if(playPromise&&typeof playPromise.catch==='function'){
            playPromise.catch(function(){
              // 動画の読み込みには成功している。
              // ここは自動再生制限として扱い、ファイル破損とは表示しない。
              notice('再生ボタンを押してください。');
            });
          }
        }

        videoEl.addEventListener('canplay',onCanPlay);
        videoEl.addEventListener('error',onPlaybackError);

        videoEl.src=d.url;
        $('empty').style.display='none';

        try{
          videoEl.load();
        }catch(e){
          cleanupPlaybackListeners();
          notice('保存した動画を読み込めませんでした。');
        }
      }catch(e){
        notice(e.message);
      }
    }
    async function loadHistory(){try{var d=await api('/api/h3-director/history?limit=10',{method:'GET'});var rows=d.sessions||[];$('history').innerHTML=rows.length?rows.map(function(s){var date=s.createdAt?new Date(s.createdAt).toLocaleString('ja-JP'):'';var ratio=['16:9','9:16'].includes(s.aspectRatio)?s.aspectRatio:'16:9';var buttons=s.recordingReady?'<button data-play="'+s.id+'" data-ratio="'+ratio+'">再生</button><button data-save="'+s.id+'">保存</button>':'';var status=s.recordingReady?'保存済み':s.recordingStatus==='uploading'?'保存処理中':'録画なし';return'<div class="history-item"><p>'+esc(s.prompt)+'</p><small>'+esc(date)+' ・ '+esc(ratio)+' ・ H3 Max Live ・ '+esc(status)+'</small><div>'+buttons+'</div></div>'}).join(''):'履歴はまだありません。';Array.prototype.forEach.call($('history').querySelectorAll('[data-play]'),function(b){b.onclick=function(){openRecording(b.dataset.play,false,b.dataset.ratio)}});Array.prototype.forEach.call($('history').querySelectorAll('[data-save]'),function(b){b.onclick=function(){openRecording(b.dataset.save,true)}})}catch(e){$('history').textContent='履歴を確認できませんでした。'}}
    async function restorePendingStart(){var pending=readPendingStart();if(!pending)return false;try{var status=await api('/api/h3-director/start-status?idempotencyKey='+encodeURIComponent(pending.idempotencyKey),{method:'GET'});if(status.resolved){clearPendingStart();return false}blocked=true;$('gate').className='gate show';$('gate').textContent='前回のライブ開始結果を確認中です。新しい生成は停止しています。管理画面で確認してください。';return true}catch(e){if(e.code==='session_not_found'){clearPendingStart();return false}blocked=true;$('gate').className='gate show';$('gate').textContent='前回のライブ開始状態を確認できません。新しい生成は停止しています。';return true}}

    $('prompt').addEventListener('input',function(){
      $('action').disabled=
        blocked||
        starting||
        imageUploading||
        promptSending||
        !this.value.trim()
    });
    $('historyToggle').addEventListener('click',function(){var open=$('historyPanel').hidden;$('historyPanel').hidden=!open;$('historyToggle').textContent=open?'履歴を閉じる':'履歴を見る';$('historyToggle').setAttribute('aria-expanded',open?'true':'false')});
    $('imagePickBtn').addEventListener('click',function(){$('imageFileInput').click()});
    $('imageFileInput').addEventListener('change',function(){var file=this.files&&this.files[0];if(file)uploadImage(file)});
    $('imageRemoveBtn').addEventListener('click',function(e){if(e){try{e.preventDefault();e.stopPropagation()}catch(_){}}clearImage()});
    $('aspectRatio').addEventListener('change',updateScreenRatio);updateScreenRatio();
    $('action').addEventListener('click',function(){live?sendPrompt():start()});$('stop').addEventListener('click',function(){finish('ライブを終了しました。')});
    $('retrySave').addEventListener('click',function(){if(pendingRecording)saveRecording(pendingRecording.blob,pendingRecording.sessionId)});
    if(isPreviewHost())$('diagnosticsWrap').hidden=false;
    $('diagnosticsToggle').addEventListener('click',function(){var open=$('diagnosticsPanel').hidden;$('diagnosticsPanel').hidden=!open;$('diagnosticsToggle').textContent=open?'診断を閉じる':'診断を見る';$('diagnosticsToggle').setAttribute('aria-expanded',open?'true':'false')});
    window.addEventListener('pagehide',function(){clearInterval(heartbeatTimer);try{if(control&&control.readyState==='open')control.send(JSON.stringify({type:'stop'}))}catch(e){}if(sessionId&&authToken){try{fetch('/api/h3-director/end-session',{method:'POST',headers:{'Authorization':'Bearer '+authToken,'Content-Type':'application/json'},body:JSON.stringify({sessionId:sessionId}),keepalive:true})}catch(e){}}if(pc)pc.close()});

    (async function init(){
      var loginToken;try{loginToken=await token()}catch(e){loginToken=''}
      if(!loginToken){
        $('imagePickBtn').disabled=true;
        $('action').disabled=true;
        $('gate').className='gate show';
        $('gate').textContent='ログインが必要です。';
        return;
      }
      try{await loadHistory();var hasPending=await restorePendingStart();var info=await api('/api/h3-director/info',{method:'GET'});$('balance').textContent=info.balance+' credits';
        if(hasPending)return;
        if(renderAccessGate(info)){
          blocked=true;
          $('action').disabled=true;
          return;
        }
        $('action').disabled=!$('prompt').value.trim();log('準備完了。最初の指示を入力してライブを開始してください。');
        if(/\.vercel\.app$/.test(location.hostname)&&location.hostname!=='flowvid-studio.vercel.app'){log('Previewテスト中: Live開始で440 creditsを消費します。')}
      }catch(e){$('gate').className='gate show';$('gate').textContent=e.message||'利用状態を確認できませんでした。';$('imagePickBtn').disabled=true;$('action').disabled=true}
    })();
  })();
  </script>
