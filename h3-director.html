    .model-switch{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.model-switch a{padding:7px 10px;color:var(--muted);text-decoration:none;font-size:11px;white-space:nowrap}.model-switch a.on{background:#fff;color:#080808;font-weight:900}

    .dot{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 16px var(--live)}.timer{font:700 12px ui-monospace,monospace}

    .side-head{padding:17px;border-bottom:1px solid var(--line)}.side-head h1{font-size:15px;margin:0 0 5px}.side-head p{margin:0;color:var(--muted);font-size:11px;line-height:1.6}
    .log{flex:1;min-height:150px;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:9px}.msg{font-size:12.5px;line-height:1.65;border:1px solid var(--line);border-radius:13px;padding:9px 11px;max-width:92%}.msg.user{align-self:flex-end;background:#151519}.msg.system{align-self:flex-start;color:#aaa;background:#080809}
    .history{border-bottom:1px solid var(--line);padding:12px 14px;display:grid;gap:8px;max-height:210px;overflow:auto}.history-title{font-size:10px;letter-spacing:.18em;color:#777;font-weight:900}.history-item{border:1px solid var(--line);border-radius:11px;padding:9px;background:#070708;font-size:11px}.history-item p{margin:0 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-item small{color:#777}.history-item button{margin:7px 6px 0 0;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#151519;color:#fff;font-size:10px}

    .meta{display:flex;gap:8px;align-items:center;font-size:10.5px;line-height:1.5;color:var(--muted)}.meta span{flex:1}.format{display:flex;align-items:center;gap:7px;white-space:nowrap}.format select{border:1px solid var(--line);border-radius:8px;background:#111;color:#fff;padding:6px 8px;font:inherit}.format select:disabled{opacity:.45}.primary,.stop,.retry{border:0;border-radius:11px;padding:11px 14px;font-weight:900}.primary{background:#f3f3f3;color:#080808}.primary:disabled{opacity:.4;cursor:not-allowed}.stop{background:#281017;color:#ff7895;display:none}.stop.show{display:block}.retry{display:none;background:#17223d;color:#b9c8ff}.retry.show{display:block}

        <div class="footnote">開始ごとに440クレジット。falの最低課金が60秒のため、途中終了でも返還されません。終了した録画は非公開で自動保存します。強制終了や通信切断時は保存できない場合があります。</div>

  <script>
  (function(){
    'use strict';
    var $=function(id){return document.getElementById(id)};
    var supabaseClient=typeof window.flowvidSupabaseClient==='function'?window.flowvidSupabaseClient():null;
    var pc=null,control=null,remoteStream=null,sessionId=null,heartbeatTimer=null,countdownTimer=null;
    var recorder=null,recordChunks=[],recordMime='',recordStartTimer=null,pendingRecording=null;
    var expiresAt=0,live=false,starting=false,blocked=false,heartbeatFailures=0,authToken='';
    var pendingStartKey='h3_director_pending_start_v1';

    function log(text,kind){var el=document.createElement('div');el.className='msg '+(kind||'system');el.textContent=text;$('log').appendChild(el);$('log').scrollTop=$('log').scrollHeight}
    function esc(text){return String(text==null?'':text).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
    function notice(text){$('notice').textContent=text;$('notice').classList.add('show');setTimeout(function(){$('notice').classList.remove('show')},5000)}
    function state(text){$('topState').textContent=text}
    function updateScreenRatio(){var ratio=$('aspectRatio').value;$('screen').classList.toggle('portrait',ratio==='9:16')}
    async function token(){if(!supabaseClient)return'';var r=await supabaseClient.auth.getSession();authToken=(r&&r.data&&r.data.session&&r.data.session.access_token)||'';return authToken}
    async function api(path,options){var t=await token();if(!t)throw new Error('ログインが必要です。');var opts=options||{};var headers=Object.assign({'Authorization':'Bearer '+t},opts.headers||{});if(opts.body)headers['Content-Type']='application/json';var r=await fetch(path,Object.assign({},opts,{headers:headers}));var data={};try{data=await r.json()}catch(e){}if(!r.ok){var err=new Error(data.message||data.error||'通信に失敗しました。');err.code=data.error;err.data=data;throw err}return data}
    function uuid(){return crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}
    function savePendingStart(value){try{sessionStorage.setItem(pendingStartKey,JSON.stringify(value))}catch(e){}}
    function readPendingStart(){try{var value=JSON.parse(sessionStorage.getItem(pendingStartKey)||'null');return value&&value.idempotencyKey?value:null}catch(e){return null}}
    function clearPendingStart(){try{sessionStorage.removeItem(pendingStartKey)}catch(e){}}
    function unknownStartError(code){return !code||['provider_start_ambiguous','session_state_requires_review','review_state_unconfirmed','refund_unconfirmed','session_start_in_progress'].includes(code)}
    function waitIce(peer){return new Promise(function(resolve,reject){if(peer.iceGatheringState==='complete')return resolve();var timeout=setTimeout(function(){cleanup();reject(new Error('接続情報を準備できませんでした。'))},12000);function done(){if(peer.iceGatheringState==='complete'){cleanup();resolve()}}function cleanup(){clearTimeout(timeout);peer.removeEventListener('icegatheringstatechange',done)}peer.addEventListener('icegatheringstatechange',done)})}
    function sendControl(message){if(!control||control.readyState!=='open')throw new Error('ライブ接続がまだ準備中です。');control.send(JSON.stringify(message))}
    function recordingMime(){var choices=['video/mp4;codecs=h264,aac','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];for(var i=0;i<choices.length;i++){if(MediaRecorder.isTypeSupported(choices[i]))return choices[i]}return''}
    function maybeStartRecording(){clearTimeout(recordStartTimer);recordStartTimer=setTimeout(function(){if(!live||recorder||!remoteStream||!remoteStream.getVideoTracks().length)return;try{recordMime=recordingMime();var options={videoBitsPerSecond:3500000,audioBitsPerSecond:128000};if(recordMime)options.mimeType=recordMime;try{recorder=new MediaRecorder(remoteStream,options)}catch(_){recorder=recordMime?new MediaRecorder(remoteStream,{mimeType:recordMime}):new MediaRecorder(remoteStream)}recordChunks=[];recorder.ondataavailable=function(e){if(e.data&&e.data.size)recordChunks.push(e.data)};recorder.onerror=function(){log('録画処理でエラーが発生しました。')};recorder.start(1000);log('ライブ映像の録画を開始しました。')}catch(e){log('この端末ではライブ録画を開始できませんでした。')}},700)}
    function stopRecording(){clearTimeout(recordStartTimer);return new Promise(function(resolve){if(!recorder||recorder.state==='inactive'){resolve(null);return}var current=recorder;current.addEventListener('stop',function(){var mime=String(current.mimeType||recordMime||'video/webm').split(';')[0];var blob=recordChunks.length?new Blob(recordChunks,{type:mime}):null;recorder=null;recordChunks=[];resolve(blob)},{once:true});try{current.stop()}catch(e){resolve(null)}})}
    function updateTimer(){var left=Math.max(0,Math.ceil((expiresAt-Date.now())/1000));$('timer').textContent='残り '+String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0&&live)finish('60秒のライブが終了しました。')}
    function cleanup(){live=false;starting=false;clearInterval(heartbeatTimer);clearInterval(countdownTimer);clearTimeout(recordStartTimer);heartbeatTimer=countdownTimer=recordStartTimer=null;if(control){try{control.close()}catch(e){}}if(pc){try{pc.close()}catch(e){}}control=pc=null;$('timer').textContent='60秒';$('aspectRatio').disabled=false;$('stop').classList.remove('show');$('action').disabled=blocked||!$('prompt').value.trim();$('action').textContent='ライブ生成を開始';state('OFFLINE')}

    function renderAccessGate(info){
      var messages=[];
      if(!info.enabled)messages.push('H3 Max Live は現在テスト停止中です。');
      if(!info.eligible)messages.push('H3 Max Live は Premium 以上の有効なプランで利用できます。<br><a href="/pricing.html#monthly">プランを見る →</a>');
      if(info.eligible&&info.accountStatus!=='active')messages.push('現在このアカウントでは生成機能を利用できません。');
      if(info.eligible&&info.accountStatus==='active'&&info.balance<440)messages.push('ライブ開始には440クレジット必要です。');
      if(!messages.length)return false;
      $('gate').className='gate show';
      $('gate').innerHTML=messages.join('<br>');
      return true;
    }

    async function saveRecording(blob,targetSession){if(!blob||!blob.size||!targetSession)return;pendingRecording={blob:blob,sessionId:targetSession};$('retrySave').classList.remove('show');state('SAVING');log('録画を保存しています…');try{await api('/api/h3-director/end-session',{method:'POST',body:JSON.stringify({sessionId:targetSession})});var slot=await api('/api/h3-director/recording-upload-url',{method:'POST',body:JSON.stringify({sessionId:targetSession,contentType:blob.type||'video/webm',byteSize:blob.size})});var up=await supabaseClient.storage.from(slot.bucket).uploadToSignedUrl(slot.path,slot.token,blob,{contentType:blob.type||'video/webm',upsert:true});if(up&&up.error)throw new Error('録画ファイルを保存できませんでした。');await api('/api/h3-director/recording-complete',{method:'POST',body:JSON.stringify({sessionId:targetSession})});pendingRecording=null;state('SAVED');log('録画を履歴へ保存しました。');notice('録画を保存しました。');await loadHistory();setTimeout(function(){if(!live)state('OFFLINE')},1800)}catch(e){state('SAVE ERROR');$('retrySave').classList.add('show');log('録画の保存に失敗しました。再試行してください。');notice(e.message)}}

    async function finish(message){if(!live&&!starting)return;var endingSession=sessionId;live=false;clearInterval(heartbeatTimer);clearInterval(countdownTimer);try{if(control&&control.readyState==='open')control.send(JSON.stringify({type:'stop'}))}catch(e){}var recording=await stopRecording();if(endingSession){try{await api('/api/h3-director/end-session',{method:'POST',body:JSON.stringify({sessionId:endingSession}),keepalive:true})}catch(e){}}cleanup();sessionId=null;if(message){log(message);notice(message)}if(recording&&endingSession)await saveRecording(recording,endingSession);else await loadHistory()}

    async function heartbeat(){if(!live||!sessionId)return;try{var data=await api('/api/h3-director/heartbeat',{method:'POST',body:JSON.stringify({sessionId:sessionId})});heartbeatFailures=0;if(!data.alive){await finish('ライブセッションが終了しました。')}}catch(e){heartbeatFailures++;if(e.code==='account_restricted'){await finish('アカウント状態の変更によりライブを終了しました。');return}if(heartbeatFailures>=3){await finish('接続を維持できなかったためライブを終了しました。自動再生成は行いません。')}}}

    async function start(){
      var prompt=$('prompt').value.trim();if(!prompt||starting||live)return;
      var aspectRatio=$('aspectRatio').value;if(!['16:9','9:16'].includes(aspectRatio)){notice('画面比率を選択してください。');return}
      if(!window.RTCPeerConnection||!window.MediaRecorder){notice('このブラウザはライブ生成・録画に対応していません。');return}
      starting=true;$('aspectRatio').disabled=true;$('action').disabled=true;$('action').textContent='接続を準備中…';$('action').classList.add('connecting');state('CONNECTING');log(prompt,'user');
      var idem=uuid();
      try{
        pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});remoteStream=new MediaStream();$('video').srcObject=remoteStream;
        pc.addTransceiver('video',{direction:'recvonly'});pc.addTransceiver('audio',{direction:'recvonly'});
        pc.ontrack=function(event){remoteStream.addTrack(event.track);$('empty').style.display='none';$('video').play().catch(function(){notice('映像をタップすると音声付きで再生できます。')});maybeStartRecording()};
        pc.onconnectionstatechange=function(){if(!pc)return;if(['failed','closed'].includes(pc.connectionState)&&live)finish('WebRTC接続が終了しました。自動再生成は行いません。')};
        control=pc.createDataChannel('fal',{ordered:true});
        control.onopen=function(){try{sendControl({type:'configure',protocol_version:1,prompt_version:1,prompt:prompt,resolution:'768p',aspect_ratio:aspectRatio,memory:12});log('H3 Max Liveへ初期指示を送信しました。')}catch(e){notice(e.message)}};
        control.onmessage=function(event){try{var msg=JSON.parse(event.data);if(msg.type==='error')notice('H3 Max Live: '+(msg.error||'エラー'));if(msg.type==='prompt_applied')log('追加指示を映像へ反映しました。');if(msg.type==='stream_exhausted')finish('ライブ生成が完了しました。')}catch(e){}};
        var offer=await pc.createOffer();await pc.setLocalDescription(offer);await waitIce(pc);
        var startBody={prompt:prompt,sdp:pc.localDescription.sdp,type:'offer',aspectRatio:aspectRatio};
        savePendingStart({idempotencyKey:idem,prompt:prompt,aspectRatio:aspectRatio,createdAt:new Date().toISOString()});
        var startOptions={method:'POST',headers:{'Idempotency-Key':idem},body:JSON.stringify(startBody)};
        var result;
        try{result=await api('/api/h3-director/start-session',startOptions)}catch(firstError){
          if(firstError.code)throw firstError;
          await new Promise(function(resolve){setTimeout(resolve,1000)});
          result=await api('/api/h3-director/start-session',startOptions);
        }
        sessionId=result.session.id;expiresAt=Date.parse(result.session.expiresAt);await pc.setRemoteDescription(result.answer);
        clearPendingStart();
        live=true;starting=false;heartbeatFailures=0;$('action').classList.remove('connecting');$('action').textContent='追加指示を送る';$('action').disabled=true;$('prompt').value='';$('stop').classList.add('show');state('LIVE');maybeStartRecording();
        log('リアルタイム生成を開始しました。映像は数秒ずつ連続して届きます。');updateTimer();countdownTimer=setInterval(updateTimer,250);await heartbeat();heartbeatTimer=setInterval(heartbeat,5000);
      }catch(e){if(unknownStartError(e.code)){blocked=true;$('gate').className='gate show';$('gate').textContent='接続結果を安全に確認できないため、新しいライブ開始を停止しました。サポートへお問い合わせください。'}else{clearPendingStart()}starting=false;$('action').classList.remove('connecting');cleanup();sessionId=null;log('開始できませんでした: '+e.message);notice(e.message)}
    }

    async function sendPrompt(){var prompt=$('prompt').value.trim();if(!prompt||!live||!sessionId)return;$('action').disabled=true;try{var approved=await api('/api/h3-director/approve-prompt',{method:'POST',body:JSON.stringify({sessionId:sessionId,prompt:prompt})});sendControl({type:'prompt',prompt_version:approved.promptVersion,prompt:approved.prompt});log(prompt,'user');$('prompt').value=''}catch(e){notice(e.message);log('指示を送信できませんでした。')}finally{$('action').disabled=!$('prompt').value.trim();$('action').textContent=live?'追加指示を送る':'ライブ生成を開始'}}

    async function openRecording(id,download,ratio){try{var d=await api('/api/h3-director/recording-url?sessionId='+encodeURIComponent(id),{method:'GET'});if(download){var a=document.createElement('a');a.href=d.url;a.download=d.filename||('h3-director-'+id);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();return}if(live){notice('ライブ終了後に履歴を再生できます。');return}if(['16:9','9:16'].includes(ratio)){$('aspectRatio').value=ratio;updateScreenRatio()}$('video').srcObject=null;$('video').src=d.url;$('empty').style.display='none';$('video').play().catch(function(){notice('再生ボタンを押してください。')})}catch(e){notice(e.message)}}
    async function loadHistory(){try{var d=await api('/api/h3-director/history?limit=10',{method:'GET'});var rows=d.sessions||[];$('history').innerHTML=rows.length?rows.map(function(s){var date=s.createdAt?new Date(s.createdAt).toLocaleString('ja-JP'):'';var ratio=['16:9','9:16'].includes(s.aspectRatio)?s.aspectRatio:'16:9';var buttons=s.recordingReady?'<button data-play="'+s.id+'" data-ratio="'+ratio+'">再生</button><button data-save="'+s.id+'">保存</button>':'';var status=s.recordingReady?'保存済み':s.recordingStatus==='uploading'?'保存処理中':'録画なし';return'<div class="history-item"><p>'+esc(s.prompt)+'</p><small>'+esc(date)+' ・ '+esc(ratio)+' ・ H3 Max Live ・ '+esc(status)+'</small><div>'+buttons+'</div></div>'}).join(''):'履歴はまだありません。';Array.prototype.forEach.call($('history').querySelectorAll('[data-play]'),function(b){b.onclick=function(){openRecording(b.dataset.play,false,b.dataset.ratio)}});Array.prototype.forEach.call($('history').querySelectorAll('[data-save]'),function(b){b.onclick=function(){openRecording(b.dataset.save,true)}})}catch(e){$('history').textContent='履歴を確認できませんでした。'}}
    async function restorePendingStart(){var pending=readPendingStart();if(!pending)return false;try{var status=await api('/api/h3-director/start-status?idempotencyKey='+encodeURIComponent(pending.idempotencyKey),{method:'GET'});if(status.resolved){clearPendingStart();return false}blocked=true;$('gate').className='gate show';$('gate').textContent='前回のライブ開始結果を確認中です。新しい生成は停止しています。管理画面で確認してください。';return true}catch(e){if(e.code==='session_not_found'){clearPendingStart();return false}blocked=true;$('gate').className='gate show';$('gate').textContent='前回のライブ開始状態を確認できません。新しい生成は停止しています。';return true}}

    $('prompt').addEventListener('input',function(){$('action').disabled=blocked||starting||!this.value.trim()});
    $('aspectRatio').addEventListener('change',updateScreenRatio);updateScreenRatio();
    $('action').addEventListener('click',function(){live?sendPrompt():start()});$('stop').addEventListener('click',function(){finish('ライブを終了しました。')});
    $('retrySave').addEventListener('click',function(){if(pendingRecording)saveRecording(pendingRecording.blob,pendingRecording.sessionId)});
    window.addEventListener('pagehide',function(){clearInterval(heartbeatTimer);try{if(control&&control.readyState==='open')control.send(JSON.stringify({type:'stop'}))}catch(e){}if(sessionId&&authToken){try{fetch('/api/h3-director/end-session',{method:'POST',headers:{'Authorization':'Bearer '+authToken,'Content-Type':'application/json'},body:JSON.stringify({sessionId:sessionId}),keepalive:true})}catch(e){}}if(pc)pc.close()});

    (async function init(){
      try{await loadHistory();var hasPending=await restorePendingStart();var info=await api('/api/h3-director/info',{method:'GET'});$('balance').textContent=info.balance+' credits';
        if(hasPending)return;
        if(renderAccessGate(info))return;
        $('action').disabled=!$('prompt').value.trim();log('準備完了。最初の指示を入力してライブを開始してください。');
      }catch(e){$('gate').className='gate show';$('gate').textContent=e.message||'利用状態を確認できませんでした。'}
    })();
  })();
  </script>
</body>
</html>
