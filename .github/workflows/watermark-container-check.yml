name: Watermark container verification

'on':
  push:
    branches:
      - fix/watermark-node24-fail-closed
    paths:
      - .github/workflows/watermark-container-check.yml
      - watermark-server/**
      - tests/watermark-*.test.js
      - tests/worker-*.test.js
      - tests/watermark-integration.cjs
      - tests/maintenance.test.js
      - api/maintenance.js
      - maintenance.html
      - vercel.json

permissions:
  contents: read

concurrency:
  group: watermark-container-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-container:
    if: github.repository == 'pina753753-star/seedance-black-studio' && github.ref == 'refs/heads/fix/watermark-node24-fail-closed' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.sha }}
      IMAGE_NAME: pina-watermark-verification
    steps:
      - name: Check out the exact public commit without credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin https://github.com/pina753753-star/seedance-black-studio.git
          git fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git -c advice.detachedHead=false checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Build the actual worker Dockerfile without publishing
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker build --pull --no-cache --progress=plain \
            --tag "$IMAGE_NAME" --file watermark-server/Dockerfile watermark-server

      - name: Verify the image runtime, dependencies, and committed worker sources offline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --mount "type=bind,source=$PWD,target=/repo,readonly" \
            "$IMAGE_NAME" sh -ec '
              for source in /repo/watermark-server/*.js /repo/watermark-server/package.json; do
                cmp "$source" "/app/$(basename "$source")"
              done
              test "$(node --version)" = "v24.22.1"
              grep -q "^VERSION_CODENAME=bookworm$" /etc/os-release
              node --version
              ffmpeg -version
              ffprobe -version
              node -e '\''const fs = require("fs"); const p = require("./package.json"); for (const name of Object.keys(p.dependencies)) { const installed = JSON.parse(fs.readFileSync("./node_modules/" + name + "/package.json", "utf8")); console.log(name + "@" + installed.version); }'\''
            '

      - name: Run all worker and maintenance unit tests with the real SDK and zero skips
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --mount "type=bind,source=$PWD,target=/repo,readonly" --workdir /repo \
            --env NODE_PATH=/app/node_modules \
            "$IMAGE_NAME" node --test --test-concurrency=1 --test-reporter=tap \
              tests/watermark-security.test.js tests/watermark-download.test.js \
              tests/watermark-hardening.test.js tests/worker-lifecycle.test.js \
              tests/worker-probe.test.js tests/worker-storage.test.js \
              tests/maintenance.test.js | tee "$RUNNER_TEMP/watermark-unit.tap"
          grep -Fx '# skipped 0' "$RUNNER_TEMP/watermark-unit.tap"

      - name: Run 36 synthetic integration checks against the built worker and dependencies
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --mount "type=bind,source=$PWD,target=/repo,readonly" --workdir /repo \
            --env NODE_PATH=/app/node_modules \
            --env PINA_TEST_WORKER_ROOT=/app --env PINA_TEST_DEPENDENCY_ROOT=/app \
            "$IMAGE_NAME" node tests/watermark-integration.cjs | tee "$RUNNER_TEMP/watermark-integration.log"
          grep -E '^RESULT 36/36 checks passed; Node v24\.22\.1;' "$RUNNER_TEMP/watermark-integration.log"

      - name: Test real HTTP authentication and synthetic FFmpeg processing offline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            "$IMAGE_NAME" node <<'NODE'
          'use strict';
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { spawn, execFileSync } = require('node:child_process');
          const { once } = require('node:events');
          const ffmpeg = require('fluent-ffmpeg');
          const fakeSecret = 'synthetic-container-test-not-a-real-secret';
          const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let responseCases = 0;
          async function request(base, route, authorization, expectedStatus) {
            const headers = { 'content-type': 'application/json' };
            if (authorization !== undefined) headers.authorization = authorization;
            const response = await fetch(base + route, { method: 'POST', headers, body: '{}', signal: AbortSignal.timeout(5000) });
            const body = await response.json();
            assert.equal(response.status, expectedStatus, `${route}: ${JSON.stringify(body)}`);
            assert.equal(body.ok, false);
            if (expectedStatus === 503) assert.equal(body.error, 'SERVICE_NOT_CONFIGURED');
            if (expectedStatus === 401) assert.equal(body.error, 'Unauthorized');
            responseCases++;
          }
          async function checkServer(secret, index) {
            const port = String(3100 + index);
            const env = { PATH: process.env.PATH, PORT: port };
            if (secret !== undefined) env.WATERMARK_SECRET = secret;
            const child = spawn(process.execPath, ['server.js'], { cwd: '/app', env, stdio: ['ignore', 'pipe', 'pipe'] });
            let output = '';
            child.stdout.on('data', (chunk) => { output += chunk; });
            child.stderr.on('data', (chunk) => { output += chunk; });
            const exited = once(child, 'exit');
            const base = `http://127.0.0.1:${port}`;
            try {
              let ready = false;
              for (let attempt = 0; attempt < 60; attempt++) {
                if (child.exitCode !== null) throw new Error(`Server exited: ${output}`);
                try {
                  const health = await fetch(base + '/', { signal: AbortSignal.timeout(500) });
                  if (health.status === 200) { assert.equal((await health.json()).ok, true); ready = true; responseCases++; break; }
                } catch {}
                await delay(100);
              }
              assert.ok(ready, `Server did not start: ${output}`);
              for (const route of ['/watermark', '/edit']) {
                if (!secret) {
                  await request(base, route, undefined, 503);
                  await request(base, route, `Bearer ${fakeSecret}`, 503);
                } else {
                  for (const auth of [undefined, '', 'Bearer wrong-test-value', `Basic ${fakeSecret}`]) await request(base, route, auth, 401);
                  await request(base, route, `Bearer ${fakeSecret}`, 400);
                }
              }
            } finally {
              child.kill('SIGTERM');
              const killTimer = setTimeout(() => child.kill('SIGKILL'), 5000);
              try { await exited; } finally { clearTimeout(killTimer); }
            }
          }
          async function main() {
            assert.equal(process.version, 'v24.22.1');
            for (const [index, secret] of [undefined, '', fakeSecret].entries()) await checkServer(secret, index);
            assert.equal(responseCases, 21);
            console.log(`PASS: ${responseCases} real HTTP response cases, no jobs requested`);

            const input = '/tmp/synthetic-input.mp4';
            const output = '/tmp/synthetic-watermarked.mp4';
            const exec = (program, args) => execFileSync(program, args, { encoding: 'utf8', timeout: 30000, maxBuffer: 4 * 1024 * 1024 });
            exec('ffmpeg', ['-hide_banner', '-loglevel', 'error', '-y', '-f', 'lavfi', '-i', 'color=c=navy:s=320x240:r=24:d=1', '-f', 'lavfi', '-i', 'sine=frequency=440:sample_rate=44100:duration=1', '-c:v', 'libx264', '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-shortest', input]);
            const source = fs.readFileSync('/app/server.js', 'utf8');
            const filter = source.match(/'-vf', "(drawtext=[^"\n]+)"/)?.[1];
            assert.equal(filter, "drawtext=text='Pina Studio':fontsize=28:fontcolor=white@0.85:x=w-tw-20:y=h-th-20:shadowcolor=black@0.8:shadowx=2:shadowy=2");
            await new Promise((resolve, reject) => {
              const command = ffmpeg(input).outputOptions('-vf', filter, '-c:a', 'copy', '-movflags', '+faststart').output(output);
              const timer = setTimeout(() => { command.kill('SIGKILL'); reject(new Error('Synthetic ffmpeg timed out')); }, 30000);
              command.on('end', () => { clearTimeout(timer); resolve(); });
              command.on('error', (error) => { clearTimeout(timer); reject(error); });
              command.run();
            });
            const probe = JSON.parse(exec('ffprobe', ['-v', 'error', '-show_streams', '-show_format', '-of', 'json', output]));
            const video = probe.streams.find((stream) => stream.codec_type === 'video');
            assert.equal(video.codec_name, 'h264');
            assert.equal(video.width, 320);
            assert.equal(video.height, 240);
            assert.ok(Number(probe.format.duration) >= 1 && Number(probe.format.duration) < 1.2);
            assert.ok(probe.streams.some((stream) => stream.codec_type === 'audio'));
            const audioHashes = (file) => JSON.parse(exec('ffprobe', ['-v', 'error', '-select_streams', 'a:0', '-show_packets', '-show_entries', 'packet=data_hash', '-show_data_hash', 'sha256', '-of', 'json', file]));
            assert.deepEqual(audioHashes(output), audioHashes(input));
            exec('ffmpeg', ['-hide_banner', '-loglevel', 'error', '-xerror', '-i', output, '-f', 'null', '-']);
            console.log('PASS: source-exact drawtext via real fluent-ffmpeg, H.264 output, unchanged audio packets, full decode');
          }
          main().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE

      - name: Summarize verification only
        shell: bash
        run: |
          printf '%s\n' 'Actual Dockerfile build passed.' 'Node 24.22.1 / Debian Bookworm verified.' 'Built worker sources match the committed source.' 'All six worker unit suites and maintenance tests passed with zero skips and the real SDK.' '36/36 built-source synthetic integration checks and 21 real HTTP authentication responses passed.' 'Source-exact drawtext, retained audio packets, and full FFmpeg decode passed.' 'No image push, deployment, real credentials, customer media, or paid API calls.' >> "$GITHUB_STEP_SUMMARY"
