<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Pina 接続確認（管理者限定）</title><style>body{font:16px system-ui;max-width:560px;margin:60px auto;padding:20px;line-height:1.7}button,a{padding:12px}button{display:block;margin:20px 0}</style><h1>接続確認（管理者限定）</h1><p>動画を送らず、接続認証だけを1回確認します。動画生成・クレジット消費は行いません。2026年10月23日9:45（日本時間）に失効します。</p><p>ログイン済みでない場合は管理者ログイン後、このページに戻ってください。</p><a href="./admin-recovery-login.html">管理者ログイン</a><button id="probe">接続を1回確認する</button><p id="status" role="status">未実行</p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./auth-config.js"></script><script>
const btn=document.getElementById('probe'),status=document.getElementById('status');
let inFlight=false;
const attemptKey='pina-recovery-auth-attempt-20261023';
if(sessionStorage.getItem(attemptKey)){btn.disabled=true;status.textContent='確認済みまたは結果確認待ちです。再操作しないでください。';}
const expiry=Date.parse('2026-10-23T00:45:00Z');
if(Date.now()>=expiry){btn.disabled=true;status.textContent='この確認機能は失効しました。';}
btn.onclick=async()=>{
 if(inFlight||sessionStorage.getItem(attemptKey))return;
 inFlight=true;btn.disabled=true;
 if(Date.now()>=expiry){btn.disabled=true;status.textContent='この確認機能は失効しました。';return;}
 const client=window.flowvidSupabaseClient();
 if(!client){status.textContent='認証設定を確認できません。';return;}
 const {data,error}=await client.auth.getSession();
 if(error||!data.session){status.textContent='管理者ログイン後、このページに戻ってください。';inFlight=false;btn.disabled=false;return;}
 sessionStorage.setItem(attemptKey,'attempted');
 btn.disabled=true;status.textContent='確認中。再操作しないでください。';
 try{
  const response=await fetch('/api/admin-recovery-probe',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+data.session.access_token},body:'{}'});
  const result=await response.json();
  status.textContent=response.ok&&result.ok===true?'接続認証を確認できました。動画処理は実行していません。':'確認できませんでした。再操作せず結果を確認します。';
 }catch{status.textContent='結果を確認できません。再操作しないでください。';}
};
</script></html>
