<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H3 Director 管理 | Pina Studio</title><meta name="theme-color" content="#050505">
<style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f5;font-family:system-ui,-apple-system,sans-serif;padding:28px}.wrap{max-width:760px;margin:auto}h1{font-size:22px}.card{border:1px solid #29292d;background:#0d0d0f;border-radius:16px;padding:18px;margin:16px 0}.row{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid #222}.muted{color:#888;font-size:13px;line-height:1.7}button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;margin-top:14px;cursor:pointer}.on{color:#5dff9a}.off{color:#ff718d}.alert{border:1px solid #303036;border-radius:12px;padding:12px;margin-top:12px;font-size:12px;line-height:1.7}.alert code{word-break:break-all;color:#bbb}.danger{background:#4b1822;color:#fff}.safe{background:#e9e9e9;color:#080808}a{color:#bdc8ff}</style></head>
<body><div class="wrap"><a href="./admin.html">← 管理画面</a><h1>H3 Max Director 管理</h1>
<div class="card"><div class="muted">通常H3・Seedanceとは別のスイッチです。有効化すると対象ユーザーが1回440クレジットで60秒のWebRTCライブを開始できます。</div><div class="row"><span>状態</span><strong id="state">確認中</strong></div><div class="row"><span>最終更新</span><strong id="updated">-</strong></div><button id="toggle" disabled>読み込み中</button><div class="muted" id="message"></div></div>
<div class="card"><h2>要確認セッション</h2><div class="muted">接続結果不明、または5分以上止まった開始処理。課金済み・falセッションありは、fal.ai確認後だけ強制解放できます。</div><div id="alerts">確認中</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./auth-config.js?v=4a1f0c1"></script><script src="./auth-guard.js?v=1"></script>
<script>(function(){
var client=typeof window.flowvidSupabaseClient==='function'?window.flowvidSupabaseClient():null,current=false,state=document.getElementById('state'),updated=document.getElementById('updated'),toggle=document.getElementById('toggle'),message=document.getElementById('message'),alerts=document.getElementById('alerts');
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
async function call(action,extra){if(!client)throw new Error('認証設定を確認できません');var s=(await client.auth.getSession()).data.session;if(!s)throw new Error('ログインが必要です');var r=await fetch('/api/h3-director/admin',{method:'POST',headers:{'Authorization':'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify(Object.assign({action:action},extra||{}))});var d=await r.json();if(!r.ok){var e=new Error(d.message||d.error||'失敗しました');e.code=d.error;throw e}return d}
function render(d){current=d.enabled;state.textContent=current?'有効':'停止';state.className=current?'on':'off';updated.textContent=d.updatedAt?new Date(d.updatedAt).toLocaleString('ja-JP'):'-';toggle.textContent=current?'Directorを停止する':'Directorを有効にする';toggle.disabled=false}
function renderAlerts(rows){if(!rows.length){alerts.textContent='要確認セッションはありません。';return}alerts.innerHTML=rows.map(function(a){var force=a.forceRequired===true;return'<div class="alert"><div><b>'+esc(a.reason)+'</b> / '+esc(a.status)+'</div><div>session: <code>'+esc(a.id)+'</code></div><div>課金: '+(a.charged?'あり':'なし')+' / fal session: '+esc(a.providerSessionId||'なし')+'</div><button class="'+(force?'danger':'safe')+'" data-release="'+esc(a.id)+'" data-force="'+(force?'1':'0')+'">'+(force?'fal確認後に強制解放':'未課金セッションを解放')+'</button></div>'}).join('');Array.prototype.forEach.call(alerts.querySelectorAll('[data-release]'),function(button){button.onclick=async function(){var force=button.dataset.force==='1';if(force&&!confirm('fal.aiで、このセッションが実行中ではないこと・利用額を確認しましたか？確認済みの場合だけ強制解放して返金します。'))return;if(!force&&!confirm('未課金の停止セッションを解放しますか？'))return;button.disabled=true;try{var out=await call('reconcileRelease',{sessionId:button.dataset.release,force:force});message.textContent='解放完了: '+out.settleCode+' / 今回返還 '+out.creditRefundedNow+' credits';await loadAlerts()}catch(e){message.textContent='解放できません: '+e.message;button.disabled=false}}})}
async function loadAlerts(){var a=await call('listAlerts');renderAlerts(a.alerts||[])}
async function load(){try{render(await call('getControl'));await loadAlerts()}catch(e){message.textContent=e.message;alerts.textContent=e.message}}
toggle.onclick=async function(){var next=!current;if(!confirm(next?'H3 Directorを有効にします。1回の開始で440クレジット、fal最低60秒分が課金されます。よろしいですか？':'H3 Directorの新規開始を停止します。よろしいですか？'))return;toggle.disabled=true;try{render(await call('setControl',{enabled:next,note:'Director admin page'}))}catch(e){message.textContent=e.message;toggle.disabled=false}};
load()
})();</script></body></html>
