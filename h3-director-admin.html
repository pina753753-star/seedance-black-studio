<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H3 Director 管理 | Pina Studio</title><meta name="theme-color" content="#050505">
<style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f5;font-family:system-ui,-apple-system,sans-serif;padding:28px}.wrap{max-width:760px;margin:auto}h1{font-size:22px}.card{border:1px solid #29292d;background:#0d0d0f;border-radius:16px;padding:18px;margin:16px 0}.row{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid #222}.muted{color:#888;font-size:13px;line-height:1.7}button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;margin-top:14px;cursor:pointer}.on{color:#5dff9a}.off{color:#ff718d}pre{white-space:pre-wrap;font-size:12px;color:#aaa}a{color:#bdc8ff}</style></head>
<body><div class="wrap"><a href="./admin.html">← 管理画面</a><h1>H3 Max Director 管理</h1>
<div class="card"><div class="muted">通常H3・Seedanceとは別のスイッチです。有効化すると対象ユーザーが1回440クレジットで60秒のWebRTCライブを開始できます。</div><div class="row"><span>状態</span><strong id="state">確認中</strong></div><div class="row"><span>最終更新</span><strong id="updated">-</strong></div><button id="toggle" disabled>読み込み中</button><div class="muted" id="message"></div></div>
<div class="card"><h2>要確認セッション</h2><div class="muted">接続結果不明、または2分以上止まった開始処理。自動返金・自動再生成はしません。</div><pre id="alerts">確認中</pre></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./auth-config.js?v=4a1f0c1"></script><script src="./auth-guard.js?v=1"></script>
<script>(function(){var client=typeof window.flowvidSupabaseClient==='function'?window.flowvidSupabaseClient():null,current=false,state=document.getElementById('state'),updated=document.getElementById('updated'),toggle=document.getElementById('toggle'),message=document.getElementById('message'),alerts=document.getElementById('alerts');async function call(action,extra){if(!client)throw new Error('認証設定を確認できません');var s=(await client.auth.getSession()).data.session;if(!s)throw new Error('ログインが必要です');var r=await fetch('/api/h3-director/admin',{method:'POST',headers:{'Authorization':'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify(Object.assign({action:action},extra||{}))});var d=await r.json();if(!r.ok)throw new Error(d.error||'失敗しました');return d}function render(d){current=d.enabled;state.textContent=current?'有効':'停止';state.className=current?'on':'off';updated.textContent=d.updatedAt?new Date(d.updatedAt).toLocaleString('ja-JP'):'-';toggle.textContent=current?'Directorを停止する':'Directorを有効にする';toggle.disabled=false}async function load(){try{render(await call('getControl'));var a=await call('listAlerts');alerts.textContent=a.alerts.length?JSON.stringify(a.alerts,null,2):'要確認セッションはありません。'}catch(e){message.textContent=e.message;alerts.textContent=e.message}}toggle.onclick=async function(){var next=!current;if(!confirm(next?'H3 Directorを有効にします。1回の開始で440クレジット、fal最低60秒分が課金されます。よろしいですか？':'H3 Directorの新規開始を停止します。よろしいですか？'))return;toggle.disabled=true;try{render(await call('setControl',{enabled:next,note:'Director admin page'}))}catch(e){message.textContent=e.message;toggle.disabled=false}};load()})();</script></body></html>
