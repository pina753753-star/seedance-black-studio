<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <title>メールアドレスの確認 | Pina Studio</title>
  <link rel="icon" type="image/png" href="/assets/brand/pina-icon-v2-favicon.png" />
  <meta name="theme-color" content="#050506" />
  <style>
    :root{--bg:#070708;--surface:#111113;--line:#2b2b2f;--muted:#99999f;--gold:#c9ac68}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{overflow-x:hidden}
    .page{width:min(100%,560px);min-height:100svh;margin:0 auto;padding:22px 16px 30px;display:flex;flex-direction:column}
    .top{display:flex;align-items:center;justify-content:space-between;min-height:42px}
    .brand{display:inline-flex;align-items:center;text-decoration:none}
    .brand img{display:block;width:124px;height:auto}
    .back{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 12px;color:#b8b8bd;font-size:12px;text-decoration:none}
    main{flex:1;display:grid;align-content:center;padding:30px 0 44px}
    .card{border:1px solid var(--line);border-radius:22px;background:var(--surface);padding:30px 24px 24px;box-shadow:0 24px 70px rgba(0,0,0,.34)}
    .eyebrow{margin:0 0 18px;color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.18em;text-align:center}
    .icon{width:68px;height:68px;margin:0 auto 20px;border:1px solid #5e5337;border-radius:18px;background:#181713;display:grid;place-items:center}
    .icon svg{width:31px;height:31px;color:#d9c483}
    h1{margin:0;text-align:center;font-size:clamp(24px,7vw,34px);font-weight:900;line-height:1.35;letter-spacing:-.045em;word-break:keep-all;overflow-wrap:normal}
    .lead{max-width:390px;margin:12px auto 0;color:var(--muted);font-size:14px;line-height:1.8;text-align:center}
    .steps{display:grid;grid-template-columns:repeat(3,1fr);align-items:start;margin:26px 0 24px}
    .step{position:relative;color:rgba(255,255,255,.35);font-size:11px;font-weight:700;text-align:center}
    .step::before{content:"";position:relative;z-index:1;display:block;width:9px;height:9px;margin:0 auto 8px;border:3px solid var(--surface);border-radius:50%;background:#35353b;box-shadow:0 0 0 1px var(--line)}
    .step:not(:last-child)::after{content:"";position:absolute;z-index:0;top:5px;left:calc(50% + 8px);width:calc(100% - 16px);height:1px;background:rgba(255,255,255,.12)}
    .step.done,.step.current{color:rgba(255,255,255,.78)}
    .step.done::before{background:var(--gold);box-shadow:0 0 0 1px rgba(201,172,104,.55)}
    .step.current::before{background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.7)}
    button,.link{display:block;width:100%;border-radius:12px;padding:15px 16px;font:inherit;font-size:15px;font-weight:900;text-align:center;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
    button{display:flex;align-items:center;justify-content:space-between;border:1px solid #fff;background:#fff;color:#070708;transition:transform .18s ease,background-color .18s ease,opacity .18s ease}
    button::after{content:"→";font-size:18px;font-weight:500;line-height:1}
    button:hover{background:#e8e8ea}
    button:active{transform:scale(.985)}
    button:disabled{cursor:default;opacity:.48;transform:none}
    .privacy{display:flex;gap:9px;align-items:flex-start;margin:16px 2px 0;color:rgba(255,255,255,.42);font-size:11px;line-height:1.65;text-align:left}
    .privacy svg{flex:0 0 auto;width:15px;height:15px;margin-top:2px;color:rgba(255,255,255,.5)}
    .link{margin-top:12px;border:1px solid var(--line);background:#171719;color:#fff}
    .message{display:none;margin-top:14px;border-radius:12px;padding:12px 13px;font-size:13px;line-height:1.65;text-align:left}
    .message.show{display:block}
    .message.error{border:1px solid rgba(251,113,133,.3);background:rgba(251,113,133,.08);color:#fecdd3}
    .message.ok{border:1px solid rgba(134,239,172,.28);background:rgba(134,239,172,.08);color:#dcfce7}
    .foot{margin:18px 0 0;color:rgba(255,255,255,.28);font-size:10px;letter-spacing:.08em;text-align:center}
    @media(max-width:390px){.page{padding:18px 12px 24px}.brand img{width:116px}.card{border-radius:18px;padding:26px 18px 20px}main{padding:22px 0 32px}.steps{margin:23px 0 21px}.step{font-size:10px}}
    @media(prefers-reduced-motion:reduce){button{transition:none}}
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <a class="brand" href="./index.html" aria-label="Pina Studio トップへ">
        <img src="/assets/brand/pina-logo-header-full.png" alt="Pina Studio" />
      </a>
      <a class="back" href="./index.html">トップへ</a>
    </header>
    <main>
      <section class="card">
        <p class="eyebrow">ACCOUNT SETUP</p>
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6.5h16v11H4z" />
            <path d="m4.5 7 7.5 6 7.5-6" />
          </svg>
        </div>
        <h1>あと一歩で完了です</h1>
        <p class="lead">メールアドレスを確認すると、そのままログインした状態でマイページへ進みます。</p>
        <div class="steps" aria-label="新規登録の進み具合">
          <div class="step done">登録済み</div>
          <div class="step current">メール確認</div>
          <div class="step">マイページ</div>
        </div>
        <button id="confirmBtn" type="button">確認してマイページへ</button>
        <div id="message" class="message" role="status" aria-live="polite"></div>
        <a id="loginLink" class="link" href="./login.html" hidden>ログイン画面へ</a>
        <div class="privacy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10V8a5 5 0 0 1 10 0v2"/><rect x="5" y="10" width="14" height="10" rx="2"/></svg>
          <span>この画面を開いただけでは確認は完了しません。上のボタンを押した時だけ、安全に認証します。</span>
        </div>
      </section>
      <p class="foot">PINA STUDIO · SECURE ACCOUNT VERIFICATION</p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./auth-config.js?v=4a1f0c1"></script>
  <script>
    (function(){
      const params=new URLSearchParams(location.search);
      const tokenHash=params.get('token_hash')||'';
      const confirmBtn=document.getElementById('confirmBtn');
      const message=document.getElementById('message');
      const loginLink=document.getElementById('loginLink');
      let running=false;

      function showMessage(text,type){
        message.textContent=text;
        message.className='message show '+type;
      }

      function showLogin(){
        loginLink.hidden=false;
      }

      function finishWithoutRetry(text){
        showMessage(text,'error');
        showLogin();
        confirmBtn.hidden=true;
      }

      function allowRetry(){
        showMessage('通信できませんでした。時間をおいて、もう一度お試しください。','error');
        confirmBtn.disabled=false;
        confirmBtn.textContent='もう一度試す';
      }

      if(!tokenHash){
        confirmBtn.disabled=true;
        showMessage('確認情報が見つかりません。確認メール内のリンクをもう一度開いてください。','error');
        showLogin();
        return;
      }

      confirmBtn.addEventListener('click',async()=>{
        if(running)return;
        running=true;
        confirmBtn.disabled=true;
        confirmBtn.textContent='確認しています…';
        try{history.replaceState(null,'',location.pathname);}catch(_){}

        const client=window.flowvidSupabaseClient?window.flowvidSupabaseClient():null;
        if(!client){
          allowRetry();
          running=false;
          return;
        }

        let result;
        try{
          result=await client.auth.verifyOtp({
            token_hash:tokenHash,
            type:'email'
          });
        }catch(_){
          allowRetry();
          running=false;
          return;
        }

        if(!result||result.error){
          finishWithoutRetry('確認できませんでした。リンクが使用済み、または期限切れの可能性があります。すでに確認済みの場合は、そのままログインできます。');
          running=false;
          return;
        }

        if(!result.data?.session){
          finishWithoutRetry('メール確認は完了しましたが、ログイン情報を保存できませんでした。ログイン画面からログインしてください。');
          running=false;
          return;
        }

        let savedSession;
        try{
          savedSession=await client.auth.getSession();
        }catch(_){
          savedSession=null;
        }

        if(savedSession?.error||!savedSession?.data?.session){
          finishWithoutRetry('メール確認は完了しましたが、ログイン情報を保存できませんでした。ログイン画面からログインしてください。');
          running=false;
          return;
        }

        showMessage('確認が完了しました。マイページへ移動します。','ok');
        location.replace('./profile.html');
      });
    })();
  </script>
</body>
</html>
